<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по моушн-дизайну · Вариант 2</title>
<style>
  :root {
    --bg: #0f1115; --surface: #1a1d24; --surface-2: #242830; --text: #e7e9ee;
    --muted: #9aa0ad; --accent: #4f8cff; --correct: #2ecc71; --wrong: #e74c3c;
    --warn: #f39c12; --border: #2c313b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
  .container { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; }
  .progress-bar { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 10; border-bottom: 1px solid var(--border); margin-bottom: 16px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .progress-track { flex: 1; height: 4px; background: var(--surface-2); border-radius: 2px; margin: 0 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
  .question { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .q-num { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
  .q-text { font-size: 16px; margin-bottom: 14px; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: background 0.12s, border-color 0.12s; font-size: 15px; }
  .option:hover { background: #2d323c; }
  .option input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
  .option.selected { border-color: var(--accent); background: #2a3344; }
  .option.correct { border-color: var(--correct); background: rgba(46, 204, 113, 0.12); }
  .option.wrong { border-color: var(--wrong); background: rgba(231, 76, 60, 0.12); }
  .option-letter { font-weight: 600; color: var(--muted); min-width: 18px; }
  .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  button { background: var(--accent); color: #fff; border: none; padding: 12px 22px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.12s, opacity 0.12s; font-family: inherit; }
  button:hover { background: #3d77e6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--surface-2); color: var(--text); }
  button.secondary:hover { background: #2d323c; }
  .results { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .score { font-size: 42px; font-weight: 700; margin: 6px 0; }
  .score-label { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: 0.6px; }
  .grade { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-weight: 500; display: inline-block; }
  .grade.excellent { background: rgba(46,204,113,0.15); color: var(--correct); }
  .grade.good { background: rgba(79,140,255,0.15); color: var(--accent); }
  .grade.ok { background: rgba(243,156,18,0.15); color: var(--warn); }
  .grade.weak { background: rgba(231,76,60,0.15); color: var(--wrong); }
  .topic-stats { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
  .topic-stat { background: var(--surface-2); padding: 8px 12px; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .topic-stat .pct { font-weight: 600; }
  .pct.ok { color: var(--correct); } .pct.mid { color: var(--warn); } .pct.low { color: var(--wrong); }
  .review-q { border-left: 4px solid var(--correct); }
  .review-q.is-wrong { border-left-color: var(--wrong); }
  .review-q.is-skipped { border-left-color: var(--warn); }
  .explain { margin-top: 12px; padding: 10px 14px; background: rgba(79,140,255,0.08); border-left: 3px solid var(--accent); border-radius: 4px; font-size: 14px; color: var(--muted); }
  .explain strong { color: var(--text); }
  .hidden { display: none; }
  @media (max-width: 600px) { h1 { font-size: 22px; } .container { padding: 16px 12px 60px; } .question { padding: 14px 14px; } .score { font-size: 34px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Тест по моушн-дизайну · Вариант 2</h1>
    <div class="subtitle">85 вопросов · один правильный ответ · 40 источников + реальные тесты по AE/C4D</div>
    <div class="subtitle"><a href="index.html" style="color:#4f8cff;">← к выбору варианта</a></div>
  </header>

  <div id="progress-bar" class="progress-bar">
    <span id="progress-text">0 / 50</span>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <span id="progress-pct">0%</span>
  </div>

  <form id="quiz-form"></form>

  <div class="actions" id="action-area">
    <button type="button" id="submit-btn">Проверить результат</button>
    <button type="button" class="secondary" id="reset-btn">Сбросить</button>
  </div>

  <div id="results" class="results hidden"></div>
</div>

<script>
const questions = [
  {q:"Какая композиционная структура основана на зеркальном повторении элементов относительно центральной оси?",options:["Асимметричная","Симметричная","Путевая","Рамочная"],correct:1,explain:"Симметричная композиция — зеркальное отражение по срединной линии.",topic:"Композиция"},
  {q:"На основе какой математической последовательности строится спираль золотого сечения?",options:["Геометрической прогрессии","Чисел Фибоначчи","Простых чисел","Факториалов"],correct:1,explain:"Спираль Фибоначчи визуализирует золотое сечение через одноимённую последовательность.",topic:"Композиция"},
  {q:"Что такое «доминанта» в композиции?",options:["Самый тёмный участок","Главный элемент, к которому привязаны остальные","Центр геометрический","Цветовое пятно у края"],correct:1,explain:"Доминанта — главный элемент, остальные элементы подчинены ей.",topic:"Композиция"},
  {q:"В чём особенность «путевой» композиционной структуры?",options:["Все элементы одинакового размера","Маршрут для взгляда через направляющие линии","Точное деление пополам","Полное отсутствие фокуса"],correct:1,explain:"Путевая структура ведёт взгляд по линиям-направляющим.",topic:"Композиция"},
  {q:"Что обеспечивает ритм в композиции?",options:["Повторение однотипных элементов с интервалом","Случайное расположение","Полная симметрия","Один большой объект"],correct:0,explain:"Ритм — повторение элементов через одинаковые/закономерные интервалы.",topic:"Композиция"},
  {q:"Какой инструмент Adobe Photoshop помогает построить сетку композиции перед рисованием?",options:["Brush","Crop Tool (Рамка)","Pen Tool","Healing Brush"],correct:1,explain:"Crop Tool в PS позволяет выбрать сетку правила третей или золотого сечения.",topic:"Композиция"},
  {q:"Какой план используется для появления или ухода персонажа в кадре?",options:["Крупный","Поясной","Общий","Макро"],correct:2,explain:"Общий план оставляет свободное место над головой и под ногами — удобно для входа/выхода.",topic:"Планы"},
  {q:"Что показывает макроплан?",options:["Всю сцену","Группу людей","Экстремальное приближение к деталям","Половину фигуры"],correct:2,explain:"Макроплан — крайнее приближение для драматического акцента.",topic:"Планы"},
  {q:"На каком плане лучше всего показывать тонкие эмоции лица?",options:["Дальнем","Общем","Крупном","Макро"],correct:2,explain:"Крупный план — оптимум для эмоций; макро уже про детали.",topic:"Планы"},
  {q:"Какова главная функция дальнего плана?",options:["Передача эмоций","Передача атмосферы и окружения","Динамичное действие","Разговоры героев"],correct:1,explain:"Дальний план акцентирует среду и атмосферу.",topic:"Планы"},
  {q:"Что нарушает принцип «монтаж по свету»?",options:["Постоянное освещение в кадрах","Резкая смена характера освещения внутри одного действия","Использование одного типа источников","Тёплая палитра"],correct:1,explain:"В рамках одного непрерывного действия свет должен быть единым.",topic:"Монтаж"},
  {q:"Что требует принцип «монтаж по композиционному центру»?",options:["Чтобы герой прыгал в кадре","Чтобы позиция героя менялась плавно от кадра к кадру","Чтобы герой всегда был в центре","Чтобы фон был статичен"],correct:1,explain:"Положение персонажа меняется без рывков.",topic:"Монтаж"},
  {q:"Какой принцип монтажа гарантирует непрерывность направления движения персонажа?",options:["По крупности","По направлению движения","По свету","По темпу"],correct:1,explain:"Движение должно продолжаться в одну сторону при склейках.",topic:"Монтаж"},
  {q:"Сколько принципов «гладкого монтажа» традиционно выделяется?",options:["5","7","10","12"],correct:2,explain:"В классических пособиях — 10 принципов.",topic:"Монтаж"},
  {q:"Что подразумевает «монтаж по направлению движущейся массы»?",options:["Согласованность объёма движущихся элементов между кадрами","Только массивные предметы","Запрет на движение","Усиление контраста"],correct:0,explain:"Поток/масса движущихся элементов согласован между склейками.",topic:"Монтаж"},
  {q:"Сколько байт занимает один пиксель в стандартной 24-битной RGB-модели (без альфы)?",options:["1 байт","2 байта","3 байта","4 байта"],correct:2,explain:"3 канала по 1 байту = 3 байта.",topic:"Цвет"},
  {q:"Какова максимальная интенсивность одного канала в 8-битной модели RGB?",options:["100","127","255","1024"],correct:2,explain:"8 бит = 2⁸ = 256 уровней (0–255).",topic:"Цвет"},
  {q:"Какие значения RGB соответствуют чистому красному?",options:["(0, 0, 255)","(255, 0, 0)","(255, 255, 0)","(128, 128, 128)"],correct:1,explain:"R=255, G=0, B=0 — чистый красный.",topic:"Цвет"},
  {q:"К какой цветовой модели относится цветной струйный/лазерный принтер?",options:["RGB","CMYK","HSB","Lab"],correct:1,explain:"Принтеры используют CMYK-краски.",topic:"Цвет"},
  {q:"Если в модели HSB Saturation = 0, цвет будет:",options:["Чисто красным","Серым/нейтральным","Чёрным","Белым"],correct:1,explain:"Saturation=0 — отсутствие насыщенности → серый оттенок.",topic:"Цвет"},
  {q:"По законам какой модели работает команда Hue/Saturation в Photoshop?",options:["RGB","CMYK","HSB","Lab"],correct:2,explain:"Hue/Saturation оперирует параметрами модели HSB.",topic:"Цвет"},
  {q:"Что такое цветовой охват (gamut)?",options:["Размер изображения","Диапазон цветов, доступных модели или устройству","Количество слоёв","Глубина цвета"],correct:1,explain:"Gamut — поддерживаемый набор цветов.",topic:"Цвет"},
  {q:"Какое цветовое пространство имеет более широкий охват?",options:["sRGB","Adobe RGB","HSB","HEX"],correct:1,explain:"Adobe RGB шире sRGB; ProPhoto RGB — ещё шире.",topic:"Цвет"},
  {q:"Какой канал модели Lab отвечает за светлоту?",options:["a","b","L","H"],correct:2,explain:"L — Lightness; a и b — цветовые оси.",topic:"Цвет"},
  {q:"Что произойдёт с изображением при гамма-коррекции с γ = 1?",options:["Будет инвертировано","Будет линейным, без изменений","Станет чёрно-белым","Получит шум"],correct:1,explain:"γ=1 — тождественное преобразование.",topic:"Гамма/контраст"},
  {q:"Какое значение n в гамма-преобразовании затемняет средние тона?",options:["n < 1","n = 1","n > 1","Любое"],correct:2,explain:"При n>1 средние тона уходят в тёмное.",topic:"Гамма/контраст"},
  {q:"Какой метод повышения контраста учитывает локальные особенности окрестности пикселя?",options:["Линейное растяжение","Гамма-коррекция","Адаптивный","Соляризация"],correct:2,explain:"Адаптивные методы анализируют окрестность пикселя.",topic:"Гамма/контраст"},
  {q:"Что показывает гистограмма яркости?",options:["Спектр цветов","Распределение количества пикселей по уровням яркости","Положение объектов в кадре","Цветовой охват"],correct:1,explain:"По оси X — яркость, по Y — количество пикселей.",topic:"Гамма/контраст"},
  {q:"Что такое соляризация в обработке изображений?",options:["Повышение насыщенности","Метод, увеличивающий различимость соседних фрагментов слиянием яркости симметричных элементов","Эффект засвета","Размытие границ"],correct:1,explain:"Соляризация работает за счёт симметричных уровней яркости.",topic:"Гамма/контраст"},
  {q:"Какова основная задача заполняющего (fill) света?",options:["Создавать главный рисунок","Смягчать тени от рисующего","Отделять объект от фона","Имитировать солнце"],correct:1,explain:"Fill light подсвечивает теневую сторону, смягчая контраст.",topic:"Освещение"},
  {q:"Какова типичная интенсивность fill относительно key?",options:["Сильнее key","Слабее key","Равна key","В 10 раз сильнее"],correct:1,explain:"Fill обычно слабее key — иначе теряется объёмная пластика.",topic:"Освещение"},
  {q:"Что такое «движущаяся голова» (moving head)?",options:["Прибор только статичной заливки","Интеллектуальный прибор с управлением направлением, цветом и формой луча","Кронштейн для фонаря","Стробоскоп"],correct:1,explain:"Movinghead — программируемый прибор-направленник.",topic:"Освещение"},
  {q:"Какой свет создаёт силуэт и отделяет фигуру от фона?",options:["Front","Side","Контровой (back)","Top"],correct:2,explain:"Контровой свет идёт сзади и обводит силуэт.",topic:"Освещение"},
  {q:"Боковой свет преимущественно:",options:["Заливает фон","Моделирует объём фигур","Создаёт эффект ночи","Подсвечивает потолок"],correct:1,explain:"Side light выявляет рельеф и форму.",topic:"Освещение"},
  {q:"Что такое compositing?",options:["Процесс кодирования","Сборка финального кадра из нескольких слоёв и элементов","Перевод цвета","Запись звука"],correct:1,explain:"Compositing — комбинирование слоёв (футаж, CG, маски, эффекты).",topic:"VFX"},
  {q:"Что описывает Motion Blur?",options:["Дрожание камеры","Размытие движущихся объектов для имитации эффекта реальной камеры","Шум сенсора","Глубину резкости"],correct:1,explain:"Motion blur — смазывание контуров при движении.",topic:"VFX"},
  {q:"Что такое codec?",options:["Тип камеры","Алгоритм сжатия видео или аудио","Раздел сценария","Цветовое пространство"],correct:1,explain:"Codec = COder/DECoder — алгоритм сжатия.",topic:"VFX"},
  {q:"Какой кодек применяется в постпродакшне как промежуточный с высоким качеством?",options:["H.264","ProRes","MP3","DV"],correct:1,explain:"Apple ProRes — стандарт пост-продакшна (как и DNxHD).",topic:"VFX"},
  {q:"Что такое rigging?",options:["Текстурирование","Создание скелета и контролов для анимации 3D-модели","Сборка света","Звуковой дизайн"],correct:1,explain:"Rigging готовит модель к анимации.",topic:"VFX"},
  {q:"Что такое Track Matte в After Effects?",options:["Тип кодека","Использование альфы или яркости одного слоя как маски для другого","Эффект размытия","Тип ключевого кадра"],correct:1,explain:"Track matte — слой-маска для другого слоя по альфе/luma.",topic:"After Effects"},
  {q:"Какое выражение зацикливает анимацию по последнему ключевому кадру?",options:["wiggle()","loopOut()","time","random()"],correct:1,explain:"loopOut() повторяет анимацию после последнего keyframe.",topic:"After Effects"},
  {q:"Через какой инструмент управляют ускорением и замедлением между ключевыми кадрами?",options:["Pen Tool","Graph Editor","Render Queue","Brush"],correct:1,explain:"Graph Editor показывает временные кривые keyframes.",topic:"After Effects"},
  {q:"Что описывает принцип анимации «Arcs»?",options:["Прямолинейное движение","Естественное движение по дугам","Постоянную скорость","Зигзаг"],correct:1,explain:"Реальные движения тел чаще описывают дуги.",topic:"Анимация"},
  {q:"«Follow Through & Overlapping Action» — это:",options:["Дублирование персонажа","Инерция и задержка движения частей тела друг относительно друга","Зацикленный жест","Резкая остановка всего тела"],correct:1,explain:"Разные части тела двигаются с задержкой и инерцией.",topic:"Анимация"},
  {q:"Принцип «Staging» говорит о:",options:["Подсветке кадра","Постановке кадра так, чтобы действие читалось с первого взгляда","Темпе монтажа","Цветовой палитре"],correct:1,explain:"Staging — ясная постановка позы/действия.",topic:"Анимация"},
  {q:"Какой движок рендера принадлежит экосистеме Blender?",options:["Octane","Redshift","Cycles","V-Ray"],correct:2,explain:"Cycles — встроенный рендер Blender (есть GPU-режим).",topic:"GPU-рендер"},
  {q:"Главное преимущество GPU-рендера над CPU-рендером:",options:["Поддержка большего числа эффектов","Параллельная обработка пикселей и высокая скорость","Безграничный объём памяти","Бесплатность"],correct:1,explain:"GPU выигрывает в параллельных задачах.",topic:"GPU-рендер"},
  {q:"Какая карта при запечке разделяет модель по материалам цветами?",options:["Normal","AO","Color ID","Curvature"],correct:2,explain:"Color ID = разные цвета на каждый материал.",topic:"Bake"},
  {q:"В каком инструменте популярна функция Paint Skew для коррекции запечки?",options:["Substance Painter","Marmoset Toolbag","Maya","Photoshop"],correct:1,explain:"Marmoset Toolbag известен Paint Skew.",topic:"Bake"},
  {q:"Зачем триангулировать модель перед запечкой?",options:["Чтобы уменьшить размер файла","Чтобы избежать артефактов на стыках полигонов","Чтобы добавить детали","Чтобы поменять UV"],correct:1,explain:"Триангуляция фиксирует геометрию и предотвращает плавающие артефакты.",topic:"Bake"},
  {q:"Какой режим наложения всегда осветляет изображение?",options:["Multiply","Darken","Screen","Color Burn"],correct:2,explain:"Screen — инверсия Multiply, всегда даёт результат светлее.",topic:"Blending"},

const form = document.getElementById('quiz-form');
const progressText = document.getElementById('progress-text');
const progressFill = document.getElementById('progress-fill');
const progressPct = document.getElementById('progress-pct');
const submitBtn = document.getElementById('submit-btn');
const resetBtn = document.getElementById('reset-btn');
const resultsDiv = document.getElementById('results');
const letters = ['A','B','C','D'];
let submitted = false;

function renderQuiz() {
  form.innerHTML = '';
  questions.forEach((item, i) => {
    const qEl = document.createElement('div');
    qEl.className = 'question';
    qEl.id = 'q-' + i;
    qEl.innerHTML = `
      <div class="q-num">Вопрос ${i + 1} · ${item.topic}</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.options.map((opt, j) => `
          <label class="option" data-idx="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span class="option-letter">${letters[j]}.</span>
            <span class="option-text">${opt}</span>
          </label>
        `).join('')}
      </div>
    `;
    form.appendChild(qEl);
  });
  attachListeners();
  updateProgress();
}

function attachListeners() {
  form.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener('change', () => {
      if (submitted) return;
      const labels = input.closest('.options').querySelectorAll('.option');
      labels.forEach(l => l.classList.remove('selected'));
      input.closest('.option').classList.add('selected');
      updateProgress();
    });
  });
}

function updateProgress() {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  const pct = Math.round((answered / questions.length) * 100);
  progressText.textContent = `${answered} / ${questions.length}`;
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

function gradeForScore(score, total) {
  const pct = (score / total) * 100;
  if (pct >= 90) return { cls: 'excellent', text: 'Отлично — к тесту готов!' };
  if (pct >= 75) return { cls: 'good',      text: 'Хорошо. Повтори слабые темы.' };
  if (pct >= 60) return { cls: 'ok',        text: 'Удовлетворительно. Нужно повторение.' };
  return                 { cls: 'weak',      text: 'Слабо. Вернись к базе знаний.' };
}

function submitQuiz() {
  let score = 0;
  const topics = {};
  questions.forEach((item, i) => {
    if (!topics[item.topic]) topics[item.topic] = { correct: 0, total: 0 };
    topics[item.topic].total++;
    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    const userIdx = selected ? parseInt(selected.value, 10) : -1;
    const isCorrect = userIdx === item.correct;
    if (isCorrect) { score++; topics[item.topic].correct++; }
    const qEl = document.getElementById('q-' + i);
    qEl.classList.add('review-q');
    if (!isCorrect) qEl.classList.add(userIdx === -1 ? 'is-skipped' : 'is-wrong');
    const optionEls = qEl.querySelectorAll('.option');
    optionEls.forEach((el, j) => {
      const input = el.querySelector('input');
      input.disabled = true;
      el.classList.remove('selected');
      if (j === item.correct) el.classList.add('correct');
      if (j === userIdx && userIdx !== item.correct) el.classList.add('wrong');
    });
    const explainEl = document.createElement('div');
    explainEl.className = 'explain';
    const userLabel = userIdx === -1 ? '<em>не отвечен</em>' : letters[userIdx];
    explainEl.innerHTML = `<strong>Правильный ответ: ${letters[item.correct]}.</strong> Твой ответ: ${userLabel}.<br>${item.explain}`;
    qEl.appendChild(explainEl);
  });
  const grade = gradeForScore(score, questions.length);
  const topicHtml = Object.entries(topics).map(([name, t]) => {
    const pct = Math.round((t.correct / t.total) * 100);
    let cls = 'low';
    if (pct >= 75) cls = 'ok';
    else if (pct >= 50) cls = 'mid';
    return `<div class="topic-stat"><span>${name}</span><span class="pct ${cls}">${t.correct} / ${t.total} · ${pct}%</span></div>`;
  }).join('');
  resultsDiv.innerHTML = `
    <div class="score-label">Результат</div>
    <div class="score">${score} / ${questions.length}</div>
    <div class="grade ${grade.cls}">${grade.text}</div>
    <div class="topic-stats">${topicHtml}</div>
  `;
  resultsDiv.classList.remove('hidden');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  submitBtn.disabled = true;
  submitBtn.textContent = 'Тест завершён';
  submitted = true;
}

function resetQuiz() {
  if (submitted && !confirm('Сбросить результаты и начать заново?')) return;
  if (!submitted) {
    const answered = form.querySelectorAll('input[type="radio"]:checked').length;
    if (answered > 0 && !confirm('Стереть все ответы?')) return;
  }
  submitted = false;
  submitBtn.disabled = false;
  submitBtn.textContent = 'Проверить результат';
  resultsDiv.classList.add('hidden');
  resultsDiv.innerHTML = '';
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

submitBtn.addEventListener('click', () => {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  if (answered < questions.length) {
    if (!confirm(`Отвечено ${answered} из ${questions.length}. Завершить тест?`)) return;
  }
  submitQuiz();
});
resetBtn.addEventListener('click', resetQuiz);

renderQuiz();
</script>
