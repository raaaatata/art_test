<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по моушн-дизайну · Вариант 1</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #242830;
    --text: #e7e9ee;
    --muted: #9aa0ad;
    --accent: #4f8cff;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --warn: #f39c12;
    --border: #2c313b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
  }
  .progress-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--surface-2);
    border-radius: 2px;
    margin: 0 14px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
  }
  .question {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .q-num {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 16px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    font-size: 15px;
  }
  .option:hover {
    background: #2d323c;
  }
  .option input {
    margin-top: 3px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .option.selected {
    border-color: var(--accent);
    background: #2a3344;
  }
  .option.correct {
    border-color: var(--correct);
    background: rgba(46, 204, 113, 0.12);
  }
  .option.wrong {
    border-color: var(--wrong);
    background: rgba(231, 76, 60, 0.12);
  }
  .option-letter {
    font-weight: 600;
    color: var(--muted);
    min-width: 18px;
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, opacity 0.12s;
    font-family: inherit;
  }
  button:hover { background: #3d77e6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: var(--surface-2);
    color: var(--text);
  }
  button.secondary:hover { background: #2d323c; }

  .results {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .score {
    font-size: 42px;
    font-weight: 700;
    margin: 6px 0;
  }
  .score-label {
    color: var(--muted);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .grade {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 500;
    display: inline-block;
  }
  .grade.excellent { background: rgba(46,204,113,0.15); color: var(--correct); }
  .grade.good      { background: rgba(79,140,255,0.15); color: var(--accent); }
  .grade.ok        { background: rgba(243,156,18,0.15); color: var(--warn); }
  .grade.weak      { background: rgba(231,76,60,0.15); color: var(--wrong); }
  .topic-stats {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 8px;
  }
  .topic-stat {
    background: var(--surface-2);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topic-stat .pct { font-weight: 600; }
  .pct.ok { color: var(--correct); }
  .pct.mid { color: var(--warn); }
  .pct.low { color: var(--wrong); }

  .review-q {
    border-left: 4px solid var(--correct);
  }
  .review-q.is-wrong {
    border-left-color: var(--wrong);
  }
  .review-q.is-skipped {
    border-left-color: var(--warn);
  }
  .explain {
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(79,140,255,0.08);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-size: 14px;
    color: var(--muted);
  }
  .explain strong { color: var(--text); }

  .hidden { display: none; }
  @media (max-width: 600px) {
    h1 { font-size: 22px; }
    .container { padding: 16px 12px 60px; }
    .question { padding: 14px 14px; }
    .score { font-size: 34px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Тест по моушн-дизайну · Вариант 1</h1>
    <div class="subtitle">50 вопросов · один правильный ответ · по литературе из списка</div>
    <div class="subtitle"><a href="index.html" style="color:#4f8cff;">← к выбору варианта</a></div>
  </header>

  <div id="progress-bar" class="progress-bar">
    <span id="progress-text">0 / 50</span>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <span id="progress-pct">0%</span>
  </div>

  <form id="quiz-form"></form>

  <div class="actions" id="action-area">
    <button type="button" id="submit-btn">Проверить результат</button>
    <button type="button" class="secondary" id="reset-btn">Сбросить</button>
  </div>

  <div id="results" class="results hidden"></div>
</div>

<script>
const questions = [
  {q:"Что такое композиция в изобразительном искусстве?",options:["Цветовая гамма произведения","Размещение и связь элементов на холсте, ведущая взгляд от главной точки фокуса к второстепенным","Стиль штриховки","Соотношение тёплых и холодных тонов"],correct:1,explain:"Композиция — размещение и связь элементов на холсте, ведущая взгляд (Smirnov School).",topic:"Композиция"},
  {q:"Какое утверждение о правиле третей верно?",options:["Холст делится на 4 равные части по диагонали","Холст делится на 9 равных частей; объекты ставятся в точки пересечения линий","Это устаревшая версия золотого сечения, не применяемая в цифровом рисовании","Используется только в портретной живописи"],correct:1,explain:"9 равных частей; точки пересечения — оптимум для фокусных зон.",topic:"Композиция"},
  {q:"Числа Фибоначчи — это:",options:["Случайная последовательность","Геометрическая прогрессия с шагом 2","Последовательность, где каждое число равно сумме двух предыдущих","Список простых чисел до 100"],correct:2,explain:"1, 1, 2, 3, 5, 8, 13… — каждое следующее равно сумме двух предыдущих.",topic:"Композиция"},
  {q:"Какое значение приблизительно соответствует золотому сечению?",options:["1:1","1:1,618","1:2","1:3,14"],correct:1,explain:"Золотое сечение ≈ 1:1,618.",topic:"Композиция"},
  {q:"Как называется композиционная структура, в которой второстепенные элементы обрамляют главный объект?",options:["Симметричная","Путевая","Рамочная","Асимметричная"],correct:2,explain:"Рамочная структура — обрамление главного объекта окружающими элементами.",topic:"Композиция"},
  {q:"Структура «ведущих линий» работает за счёт того, что:",options:["Все объекты в кадре одинакового размера","Линии в кадре направляют взгляд зрителя к фокусной точке","Кадр делится точно пополам","Используется только тёплая палитра"],correct:1,explain:"Дороги, реки, контуры тел работают как направляющие.",topic:"Композиция"},
  {q:"На каком плане персонаж занимает 1/7–1/10 кадра?",options:["Крупный","Средний","Дальний","Макро"],correct:2,explain:"На дальнем плане персонаж занимает 1/7–1/10 кадра.",topic:"Планы"},
  {q:"Кадрирование «от середины груди и выше» — это какой план?",options:["Общий","Поясной (первый средний)","Крупный","Дальний"],correct:2,explain:"От середины груди и выше — крупный план.",topic:"Планы"},
  {q:"Какой план чаще применяют для важных диалогов с показом фигур «от уровня колен и выше»?",options:["Общий","Второй средний","Крупный","Макро"],correct:1,explain:"Второй средний план — фигура от колен и выше.",topic:"Планы"},
  {q:"Близкие планы по сравнению с дальними:",options:["Снижают сопереживание зрителя","Повышают сопереживание зрителя","Не влияют на эмоциональное восприятие","Используются только в комедии"],correct:1,explain:"Близкие планы повышают эмпатию; дальние концентрируют внимание на окружении.",topic:"Планы"},
  {q:"Что такое «ось взаимодействия» (линия взаимодействия) в монтаже?",options:["Горизонт в кадре","Воображаемая линия между взаимодействующими персонажами; камеры должны располагаться с одной её стороны","Линия движения камеры по сцене","Граница между задним и передним планом"],correct:1,explain:"Все точки съёмки — с одной стороны оси, иначе зритель путается в пространстве.",topic:"Монтаж"},
  {q:"Принцип «монтаж по крупности» означает:",options:["Всегда соединять кадры одинакового размера","Не клеить подряд кадры одинаковой крупности с одним персонажем","Использовать только крупные планы","Чем крупнее план, тем длиннее склейка"],correct:1,explain:"Между планами одной крупности нужны промежуточные (например, реакции).",topic:"Монтаж"},
  {q:"Согласно принципу «монтаж по фазе движения», склейку лучше делать:",options:["В середине движения","В начале или в конце движения","Только при полной остановке","Это не имеет значения"],correct:1,explain:"Начало и конец движения — естественные точки склейки.",topic:"Монтаж"},
  {q:"Принцип «монтаж по темпу» требует:",options:["Одинаковой скорости движения объектов в склеиваемых кадрах","Постоянного ускорения","Случайной смены ритма","Резкого замедления перед каждой склейкой"],correct:0,explain:"Скорость движения объекта должна быть постоянной от кадра к кадру.",topic:"Монтаж"},
  {q:"Что подразумевает «монтаж по смещению осей»?",options:["Достаточно сменить только расстояние до объекта","Менять только угол съёмки, сохраняя расстояние","При смене плана менять и расстояние, и угол съёмки","Никогда не менять угол"],correct:2,explain:"Меняются и расстояние, и угол одновременно.",topic:"Монтаж"},
  {q:"Какая модель цвета является аддитивной?",options:["CMYK","RGB","Pantone","Lab"],correct:1,explain:"RGB — аддитивная (свет складывается), CMYK — субтрактивная.",topic:"Цвет"},
  {q:"Сколько цветов даёт стандартный 24-битный RGB (8 бит на канал)?",options:["256","65 536","16,7 миллиона","4,3 миллиарда"],correct:2,explain:"256³ ≈ 16,7 млн.",topic:"Цвет"},
  {q:"Какой цвет получается при RGB (255, 255, 255)?",options:["Чёрный","Серый","Белый","Красный"],correct:2,explain:"Все каналы на максимуме = белый.",topic:"Цвет"},
  {q:"Где традиционно применяется модель CMYK?",options:["В мониторах","В печати","В веб-разработке","В RAW-съёмке"],correct:1,explain:"CMYK — для печати на бумаге.",topic:"Цвет"},
  {q:"Что обозначает буква K в CMYK?",options:["Kelvin","Key (чёрный)","Kilo","Kaolin"],correct:1,explain:"K = Key, чёрный краситель.",topic:"Цвет"},
  {q:"Какой компонент модели HSB отвечает за тип цвета на цветовом круге?",options:["Saturation","Brightness","Hue","Value"],correct:2,explain:"Hue — оттенок (0–360°).",topic:"Цвет"},
  {q:"В чём отличие HSL от HSB?",options:["HSL использует Lightness вместо Brightness","HSL — субтрактивная модель","HSL не имеет компонента Hue","HSL предназначена только для печати"],correct:0,explain:"HSL = Hue, Saturation, Lightness.",topic:"Цвет"},
  {q:"Цветовая модель Lab характеризуется тем, что:",options:["Привязана к конкретному устройству","Аппаратно-независима и основана на восприятии цвета человеком","Используется только в полиграфии","Имеет только два канала"],correct:1,explain:"Lab — perceptually uniform, не зависит от устройства.",topic:"Цвет"},
  {q:"HEX-запись цвета #9932CC соответствует какой системе?",options:["HSB","Шестнадцатеричное представление RGB","CMYK","Lab"],correct:1,explain:"HEX — 6 шестнадцатеричных цифр для R, G, B.",topic:"Цвет"},
  {q:"Какова типичная гамма sRGB?",options:["1,0","1,5","~2,2","5,0"],correct:2,explain:"Гамма sRGB ≈ 2,2.",topic:"Гамма/контраст"},
  {q:"Зачем нужна гамма-коррекция?",options:["Чтобы увеличить размер файла","Чтобы скомпенсировать нелинейность отклика дисплея и восприятия яркости человеком","Чтобы перевести RGB в CMYK","Чтобы убрать альфа-канал"],correct:1,explain:"Гамма выравнивает нелинейность дисплея и восприятия.",topic:"Гамма/контраст"},
  {q:"Какое цветовое пространство применяется внутри 3D-рендера для физически корректного смешения света?",options:["sRGB","Linear (γ=1)","CMYK","Lab"],correct:1,explain:"В Linear свет складывается по физическим законам.",topic:"Гамма/контраст"},
  {q:"Метод «линейного растяжения» гистограммы:",options:["Сжимает диапазон яркостей","Приводит яркости к полному доступному диапазону, делая гистограмму более редкой","Превращает изображение в чёрно-белое","Применяет случайный шум"],correct:1,explain:"z' = (z - z_min)/(z_max - z_min) × z_max.",topic:"Гамма/контраст"},
  {q:"Какие значения параметра гамма-коррекции повышают контраст в области высоких яркостей?",options:["n = 0,1…0,5","n = 1","n = 2…10","n < 0"],correct:2,explain:"n=2…10 — для высоких яркостей; n=0,1…0,5 — для низких.",topic:"Гамма/контраст"},
  {q:"Какой источник света в трёхточечной схеме называется «рисующим»?",options:["Fill light","Back light","Key light","Ambient light"],correct:2,explain:"Key light — главный, формирует основные тени.",topic:"Освещение"},
  {q:"Какова основная роль контрового (back) света?",options:["Создавать основные тени на лице","Заполнять тени от рисующего света","Отделять объект от фона, обводить силуэт","Имитировать дневной свет"],correct:2,explain:"Контровой свет идёт сзади-сверху и обводит силуэт.",topic:"Освещение"},
  {q:"Под каким углом обычно ставится «основной» (front) свет в схеме сценического освещения?",options:["0° (строго в лоб)","30–45°","90°","180°"],correct:1,explain:"30–45° — стандартный угол front light.",topic:"Освещение"},
  {q:"Какой тип прибора даёт «широкий равномерный свет без чёткой границы»?",options:["Profile spotlight","Floodlight (прожектор общего освещения)","Pinspot","Frenel-направленный прожектор"],correct:1,explain:"Floodlights — заливающий, без чёткой границы луча.",topic:"Освещение"},
  {q:"К «направленным» прожекторам не относится:",options:["Профильный","Френель","PC-прожектор","Floodlight"],correct:3,explain:"Floodlight — прожектор общего, а не направленного света.",topic:"Освещение"},
  {q:"Что такое keying в VFX?",options:["Сжатие видеопотока","Извлечение прозрачности по цвету (например, удаление зелёного фона)","Автоматическое сглаживание движения","Запись звука"],correct:1,explain:"Keying = chroma key, выделение прозрачности по цвету.",topic:"VFX"},
  {q:"Что такое rotoscoping?",options:["Расчёт глобального освещения","Покадровое обведение объекта маской вручную","Вид цветокоррекции","Тип кодека"],correct:1,explain:"Ротоскопинг — ручная отрисовка маски по кадрам.",topic:"VFX"},
  {q:"Tracking в композитинге используется для:",options:["Сжатия видео","Отслеживания движения точек/объектов и привязки CG-элементов к кадру","Автоматического перевода аудио","Конвертации цветовых пространств"],correct:1,explain:"Трекинг привязывает 3D/2D-элементы к движению камеры.",topic:"VFX"},
  {q:"Альфа-канал — это:",options:["Дополнительный канал прозрачности (4-й в RGBA)","Канал звука","Канал глубины (depth)","Канал нормалей"],correct:0,explain:"Alpha — 4-й канал, прозрачность пикселя.",topic:"VFX"},
  {q:"Ключевой кадр (keyframe) — это:",options:["Кадр, в котором персонаж говорит главную фразу","Кадр, фиксирующий значение параметра; промежуточные значения интерполируются автоматически","Самый яркий кадр в эпизоде","Первый кадр композиции"],correct:1,explain:"Keyframe = опорная точка анимации; между ними — интерполяция.",topic:"VFX"},
  {q:"Что такое прекомпозиция (pre-comp) в After Effects?",options:["Эскиз перед началом работы","Композиция, помещённая внутрь другой композиции как один слой","Тип эффекта размытия","Формат экспорта"],correct:1,explain:"Pre-comp — вложенная композиция, выступающая как один слой.",topic:"After Effects"},
  {q:"Выражение wiggle(2, 50) в After Effects:",options:["Зацикливает анимацию","Создаёт случайные колебания параметра 2 раза в секунду с амплитудой 50","Поворачивает слой на 50°","Меняет цвет"],correct:1,explain:"wiggle(freq, amp): 2 Гц, амплитуда 50.",topic:"After Effects"},
  {q:"Стандартный кинематографический фреймрейт:",options:["12 fps","24 fps","50 fps","120 fps"],correct:1,explain:"24 fps — стандарт кинематографа.",topic:"After Effects"},
  {q:"Принцип анимации «Squash & Stretch» отвечает за:",options:["Передачу массы и упругости объекта","Подготовительное движение","Замедление в начале и конце","Поворот по дуге"],correct:0,explain:"Сжатие/растяжение передаёт массу и упругость.",topic:"Анимация"},

const form = document.getElementById('quiz-form');
const progressText = document.getElementById('progress-text');
const progressFill = document.getElementById('progress-fill');
const progressPct = document.getElementById('progress-pct');
const submitBtn = document.getElementById('submit-btn');
const resetBtn = document.getElementById('reset-btn');
const resultsDiv = document.getElementById('results');
const letters = ['A','B','C','D'];
let submitted = false;

function renderQuiz() {
  form.innerHTML = '';
  questions.forEach((item, i) => {
    const qEl = document.createElement('div');
    qEl.className = 'question';
    qEl.id = 'q-' + i;
    qEl.innerHTML = `
      <div class="q-num">Вопрос ${i + 1} · ${item.topic}</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.options.map((opt, j) => `
          <label class="option" data-idx="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span class="option-letter">${letters[j]}.</span>
            <span class="option-text">${opt}</span>
          </label>
        `).join('')}
      </div>
    `;
    form.appendChild(qEl);
  });
  attachListeners();
  updateProgress();
}

function attachListeners() {
  form.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener('change', () => {
      if (submitted) return;
      const labels = input.closest('.options').querySelectorAll('.option');
      labels.forEach(l => l.classList.remove('selected'));
      input.closest('.option').classList.add('selected');
      updateProgress();
    });
  });
}

function updateProgress() {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  const pct = Math.round((answered / questions.length) * 100);
  progressText.textContent = `${answered} / ${questions.length}`;
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

function gradeForScore(score, total) {
  const pct = (score / total) * 100;
  if (pct >= 90) return { cls: 'excellent', text: 'Отлично — к тесту готов!' };
  if (pct >= 75) return { cls: 'good',      text: 'Хорошо. Повтори слабые темы.' };
  if (pct >= 60) return { cls: 'ok',        text: 'Удовлетворительно. Нужно повторение.' };
  return                 { cls: 'weak',      text: 'Слабо. Вернись к базе знаний.' };
}

function submitQuiz() {
  let score = 0;
  const topics = {};
  questions.forEach((item, i) => {
    if (!topics[item.topic]) topics[item.topic] = { correct: 0, total: 0 };
    topics[item.topic].total++;

    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    const userIdx = selected ? parseInt(selected.value, 10) : -1;
    const isCorrect = userIdx === item.correct;
    if (isCorrect) {
      score++;
      topics[item.topic].correct++;
    }

    const qEl = document.getElementById('q-' + i);
    qEl.classList.add('review-q');
    if (!isCorrect) {
      qEl.classList.add(userIdx === -1 ? 'is-skipped' : 'is-wrong');
    }
    const optionEls = qEl.querySelectorAll('.option');
    optionEls.forEach((el, j) => {
      const input = el.querySelector('input');
      input.disabled = true;
      el.classList.remove('selected');
      if (j === item.correct) el.classList.add('correct');
      if (j === userIdx && userIdx !== item.correct) el.classList.add('wrong');
    });

    const explainEl = document.createElement('div');
    explainEl.className = 'explain';
    const userLabel = userIdx === -1 ? '<em>не отвечен</em>' : letters[userIdx];
    explainEl.innerHTML = `<strong>Правильный ответ: ${letters[item.correct]}.</strong> Твой ответ: ${userLabel}.<br>${item.explain}`;
    qEl.appendChild(explainEl);
  });

  const grade = gradeForScore(score, questions.length);
  const topicHtml = Object.entries(topics).map(([name, t]) => {
    const pct = Math.round((t.correct / t.total) * 100);
    let cls = 'low';
    if (pct >= 75) cls = 'ok';
    else if (pct >= 50) cls = 'mid';
    return `<div class="topic-stat"><span>${name}</span><span class="pct ${cls}">${t.correct} / ${t.total} · ${pct}%</span></div>`;
  }).join('');

  resultsDiv.innerHTML = `
    <div class="score-label">Результат</div>
    <div class="score">${score} / ${questions.length}</div>
    <div class="grade ${grade.cls}">${grade.text}</div>
    <div class="topic-stats">${topicHtml}</div>
  `;
  resultsDiv.classList.remove('hidden');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

  submitBtn.disabled = true;
  submitBtn.textContent = 'Тест завершён';
  submitted = true;
}

function resetQuiz() {
  if (submitted && !confirm('Сбросить результаты и начать заново?')) return;
  if (!submitted) {
    const answered = form.querySelectorAll('input[type="radio"]:checked').length;
    if (answered > 0 && !confirm('Стереть все ответы?')) return;
  }
  submitted = false;
  submitBtn.disabled = false;
  submitBtn.textContent = 'Проверить результат';
  resultsDiv.classList.add('hidden');
  resultsDiv.innerHTML = '';
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

submitBtn.addEventListener('click', () => {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  if (answered < questions.length) {
    if (!confirm(`Отвечено ${answered} из ${questions.length}. Завершить тест?`)) return;
  }
  submitQuiz();
});
resetBtn.addEventListener('click', resetQuiz);

renderQuiz();
</script>
