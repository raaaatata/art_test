<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по моушн-дизайну · Вариант 4</title>
<style>
  :root {
    --bg: #0f1115; --surface: #1a1d24; --surface-2: #242830; --text: #e7e9ee;
    --muted: #9aa0ad; --accent: #4f8cff; --correct: #2ecc71; --wrong: #e74c3c;
    --warn: #f39c12; --border: #2c313b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
  .container { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; }
  .progress-bar { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 10; border-bottom: 1px solid var(--border); margin-bottom: 16px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .progress-track { flex: 1; height: 4px; background: var(--surface-2); border-radius: 2px; margin: 0 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
  .question { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .q-num { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
  .q-text { font-size: 16px; margin-bottom: 14px; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: background 0.12s, border-color 0.12s; font-size: 15px; }
  .option:hover { background: #2d323c; }
  .option input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
  .option.selected { border-color: var(--accent); background: #2a3344; }
  .option.correct { border-color: var(--correct); background: rgba(46, 204, 113, 0.12); }
  .option.wrong { border-color: var(--wrong); background: rgba(231, 76, 60, 0.12); }
  .option-letter { font-weight: 600; color: var(--muted); min-width: 18px; }
  .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  button { background: var(--accent); color: #fff; border: none; padding: 12px 22px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.12s, opacity 0.12s; font-family: inherit; }
  button:hover { background: #3d77e6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--surface-2); color: var(--text); }
  button.secondary:hover { background: #2d323c; }
  .results { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .score { font-size: 42px; font-weight: 700; margin: 6px 0; }
  .score-label { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: 0.6px; }
  .grade { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-weight: 500; display: inline-block; }
  .grade.excellent { background: rgba(46,204,113,0.15); color: var(--correct); }
  .grade.good { background: rgba(79,140,255,0.15); color: var(--accent); }
  .grade.ok { background: rgba(243,156,18,0.15); color: var(--warn); }
  .grade.weak { background: rgba(231,76,60,0.15); color: var(--wrong); }
  .topic-stats { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
  .topic-stat { background: var(--surface-2); padding: 8px 12px; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .topic-stat .pct { font-weight: 600; }
  .pct.ok { color: var(--correct); } .pct.mid { color: var(--warn); } .pct.low { color: var(--wrong); }
  .review-q { border-left: 4px solid var(--correct); }
  .review-q.is-wrong { border-left-color: var(--wrong); }
  .review-q.is-skipped { border-left-color: var(--warn); }
  .explain { margin-top: 12px; padding: 10px 14px; background: rgba(79,140,255,0.08); border-left: 3px solid var(--accent); border-radius: 4px; font-size: 14px; color: var(--muted); }
  .explain strong { color: var(--text); }
  .hidden { display: none; }
  @media (max-width: 600px) { h1 { font-size: 22px; } .container { padding: 16px 12px 60px; } .question { padding: 14px 14px; } .score { font-size: 34px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Тест по моушн-дизайну · Вариант 4</h1>
    <div class="subtitle">85 вопросов · один правильный ответ · 40 источников + реальные тесты по AE/C4D</div>
    <div class="subtitle"><a href="index.html" style="color:#4f8cff;">← к выбору варианта</a></div>
  </header>

  <div id="progress-bar" class="progress-bar">
    <span id="progress-text">0 / 50</span>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <span id="progress-pct">0%</span>
  </div>

  <form id="quiz-form"></form>

  <div class="actions" id="action-area">
    <button type="button" id="submit-btn">Проверить результат</button>
    <button type="button" class="secondary" id="reset-btn">Сбросить</button>
  </div>

  <div id="results" class="results hidden"></div>
</div>

<script>
const questions = [
  {q:"Какой принцип помогает сделать композицию устойчивой?",options:["Контраст","Баланс","Шум","Деформация"],correct:1,explain:"Баланс — равновесие визуальных весов; ключ к устойчивости.",topic:"Композиция"},
  {q:"Какое отношение чисел в золотом сечении?",options:["1:1","≈1,618:1","1:π","2:1"],correct:1,explain:"Золотое сечение φ ≈ 1,618.",topic:"Композиция"},
  {q:"Что характеризует контраст в композиции?",options:["Только тёмный фон","Разница в свойствах элементов: размер, цвет, форма","Идеальная симметрия","Прозрачность"],correct:1,explain:"Контраст — противопоставление любых параметров элементов.",topic:"Композиция"},
  {q:"Какая композиционная структура естественнее всего создаёт ощущение движения?",options:["Симметричная","Рамочная","Путевая (с ведущими линиями)","Статическая"],correct:2,explain:"Ведущие линии «толкают» взгляд по маршруту.",topic:"Композиция"},
  {q:"Какое правило проще освоить новичку, чем золотое сечение?",options:["Правило третей","Правило одного объекта","Закон негатива","Принцип монотонности"],correct:0,explain:"Правило третей — упрощённая версия золотого сечения.",topic:"Композиция"},
  {q:"Что обеспечивает «иерархия» в композиции?",options:["Случайный порядок","Разделение элементов по степени важности","Одинаковость размеров","Удаление фокуса"],correct:1,explain:"Иерархия задаёт порядок чтения визуала.",topic:"Композиция"},
  {q:"Какие планы относятся к «крупным»?",options:["Дальний и общий","Поясной и второй средний","Крупный и макро","Только средние"],correct:2,explain:"Крупный (от середины груди) и макро — крупные планы.",topic:"Планы"},
  {q:"Какой план чаще всего используется в новостных съёмках для интервью?",options:["Дальний","Поясной (первый средний)","Макро","Общий с пейзажем"],correct:1,explain:"Поясной — оптимум читабельности и информативности.",topic:"Планы"},
  {q:"Чем отличается общий план от дальнего?",options:["У общего больше пейзажа","У общего меньше окружающего пространства, виден весь персонаж","Дальний всегда статичен","Общий — это синоним макро"],correct:1,explain:"На общем виден персонаж целиком; дальний — заметно шире.",topic:"Планы"},
  {q:"На каком плане акцент делается на отдельных деталях, например глазах?",options:["Дальний","Общий","Поясной","Макро"],correct:3,explain:"Макроплан — экстремальное приближение для деталей.",topic:"Планы"},
  {q:"Что произойдёт, если нарушить принцип «оси» в монтаже диалога?",options:["Звук рассинхронизуется","Зритель потеряет ориентацию в пространстве и собеседники «прыгнут» местами","Кадр станет тёмным","Изменится цветовая гамма"],correct:1,explain:"Пересечение оси сбивает пространственную логику.",topic:"Монтаж"},
  {q:"Что объединяет принципы «по фазе» и «по темпу»?",options:["Оба касаются движения объекта в кадре","Оба касаются звука","Оба про цвет","Оба про композицию"],correct:0,explain:"Оба следят за непрерывностью движения.",topic:"Монтаж"},
  {q:"Зачем сохранять единое освещение между склейками?",options:["Чтобы экономить трафик","Чтобы зритель воспринимал их как единое действие","Чтобы уменьшить размер файла","Это требование закона"],correct:1,explain:"Свет — маркер непрерывности сцены.",topic:"Монтаж"},
  {q:"Какой принцип запрещает резкие цветовые скачки между склейками?",options:["По крупности","По свету","По цвету","По темпу"],correct:2,explain:"«Монтаж по цвету» — против резких цветовых перепадов.",topic:"Монтаж"},
  {q:"При смене плана согласно принципу «смещения осей» нужно изменять одновременно:",options:["Только расстояние","Только угол","И расстояние, и угол съёмки","Размер кадра в пикселях"],correct:2,explain:"Меняются оба параметра — расстояние и угол.",topic:"Монтаж"},
  {q:"Какая модель цвета использует «вычитание света» из белого?",options:["RGB","CMYK (субтрактивная)","HSB","Lab"],correct:1,explain:"CMYK работает на отражённом свете.",topic:"Цвет"},
  {q:"Что означает «24-битный RGB»?",options:["24 бита на канал","8 бит × 3 канала = 24 бита","24 цвета","24 канала"],correct:1,explain:"24 бита = 3 канала по 8 бит.",topic:"Цвет"},
  {q:"Какой цвет представляет HEX #000000?",options:["Белый","Чёрный","Красный","Серый"],correct:1,explain:"Все каналы по 0x00 — чёрный.",topic:"Цвет"},
  {q:"В каких единицах измеряется компонент Hue в HSB?",options:["В пикселях","В градусах (0–360°)","В процентах","В кельвинах"],correct:1,explain:"Hue распределён по окружности 360°.",topic:"Цвет"},
  {q:"Что такое saturation в цветовой модели?",options:["Светлота","Насыщенность, интенсивность цвета","Тип цвета","Контраст изображения"],correct:1,explain:"Saturation = насыщенность.",topic:"Цвет"},
  {q:"Какая буква добавлена в CMYK помимо C, M, Y и почему?",options:["A — Alpha","K — Key (чёрный), потому что чистая смесь CMY даёт грязный коричневый","X — Extra","R — Red"],correct:1,explain:"K даёт глубокий чёрный и экономит CMY-краски.",topic:"Цвет"},
  {q:"Какое цветовое пространство применяется для профессиональной полиграфии и обладает широким охватом?",options:["sRGB","HSB","Adobe RGB / ProPhoto RGB","HEX"],correct:2,explain:"Adobe RGB и ProPhoto RGB шире sRGB.",topic:"Цвет"},
  {q:"Сколько символов в стандартной HEX-записи цвета без альфы?",options:["3","6","8","12"],correct:1,explain:"#RRGGBB — 6 символов после решётки.",topic:"Цвет"},
  {q:"Чем хороша Lab для цветокоррекции?",options:["Привязана к монитору","Аппаратно-независима и отделяет светлоту (L) от цвета (a, b)","Это субтрактивная модель","Это формат файла"],correct:1,explain:"Lab позволяет править светлоту, не трогая цвет.",topic:"Цвет"},
  {q:"К какому цветовому пространству приводят изображение для веб-публикации?",options:["Adobe RGB","ProPhoto RGB","sRGB","Lab"],correct:2,explain:"sRGB — стандарт большинства браузеров и мониторов.",topic:"Гамма/контраст"},
  {q:"Какое значение гаммы соответствует sRGB?",options:["1,0","≈2,2","3,5","0,5"],correct:1,explain:"Гамма sRGB ≈ 2,2.",topic:"Гамма/контраст"},
  {q:"Какой становится гистограмма после линейного растяжения?",options:["Сжатой к центру","Более редкой, растянутой по всему диапазону","Полностью равномерной","Зеркально перевёрнутой"],correct:1,explain:"Растяжение раздвигает столбцы по диапазону.",topic:"Гамма/контраст"},
  {q:"Что отличает адаптивные методы повышения контраста от глобальных?",options:["Применяются только к тёмным фото","Учитывают локальные особенности окрестности пикселя","Работают быстрее","Не требуют параметров"],correct:1,explain:"Адаптивные методы — локальные, глобальные — на всё изображение.",topic:"Гамма/контраст"},
  {q:"Что выровнено в результате эквализации гистограммы?",options:["Цветовой охват","Распределение яркостей по диапазону","Количество слоёв","Разрешение"],correct:1,explain:"Эквализация делает распределение яркостей более равномерным.",topic:"Гамма/контраст"},
  {q:"Сколько источников в классической трёхточечной схеме освещения?",options:["1","2","3 (key, fill, back)","6"],correct:2,explain:"Три источника: рисующий, заполняющий, контровой.",topic:"Освещение"},
  {q:"Что такое «френель» (Fresnel) в сценическом свете?",options:["Тип звуковой колонки","Тип направленного прожектора с регулировкой жёсткости луча","Цветной фильтр","Лампа накаливания"],correct:1,explain:"Френель — направленный прибор, луч можно делать мягче/жёстче.",topic:"Освещение"},
  {q:"К каким приборам относятся «интеллектуальные», управляемые с пульта?",options:["Floodlights","Movinghead (движущиеся головы)","Open faced","Свечи"],correct:1,explain:"Движущиеся головы — программируемые.",topic:"Освещение"},
  {q:"Какой свет лучше всего подчёркивает фактуру и форму объекта?",options:["Front (лобовой)","Back (контровой)","Side (боковой)","Ambient"],correct:2,explain:"Боковой свет даёт скользящие тени и выявляет рельеф.",topic:"Освещение"},
  {q:"Что значит «front light»?",options:["Свет снизу","Основной свет спереди под углом 30–45°","Свет сзади","Свет в потолок"],correct:1,explain:"Front light — основной фронтальный, 30–45°.",topic:"Освещение"},
  {q:"Что такое keyframe?",options:["Любой кадр анимации","Кадр, фиксирующий значение параметра, между такими кадрами выполняется интерполяция","Финальный кадр рендера","Специальный кодек"],correct:1,explain:"Keyframe = опорная точка анимации.",topic:"VFX"},
  {q:"Что такое маска (mask) в композитинге?",options:["Грим актёра","Изображение, размечающее области кадра для применения эффектов","Тип сжатия","Звуковой фильтр"],correct:1,explain:"Маска — область применения эффекта/прозрачности.",topic:"VFX"},
  {q:"Что хранит файл формата с альфа-каналом (например, PNG)?",options:["Только цвет","Цвет + информацию о прозрачности","Только прозрачность","Только метаданные"],correct:1,explain:"PNG поддерживает прозрачность через alpha-канал.",topic:"VFX"},
  {q:"Какой кодек чаще всего используется для вещания и стриминга?",options:["ProRes","DPX","H.264","RAW"],correct:2,explain:"H.264 — стандарт стриминга и доставки.",topic:"VFX"},
  {q:"Что такое анимация в широком смысле в композитинге/моушне?",options:["Только рисование","Изменение параметров слоёв во времени","Запись звука","Кодирование"],correct:1,explain:"Анимация = изменение параметров (Position, Scale, Opacity и т.д.).",topic:"VFX"},
  {q:"Что отличает прекомпозицию от обычного слоя в After Effects?",options:["Это специальный 3D-слой","Прекомпозиция — целая вложенная композиция, выступающая как один слой","Это эффект","Это формат экспорта"],correct:1,explain:"Pre-comp = вложенная сцена-слой.",topic:"After Effects"},
  {q:"Что делает Graph Editor в After Effects?",options:["Показывает гистограмму цвета","Управляет временными кривыми ключевых кадров (easing)","Сжимает видео","Импортирует звук"],correct:1,explain:"Graph Editor задаёт ускорения/замедления.",topic:"After Effects"},
  {q:"Какой параметр слоя отвечает за непрозрачность?",options:["Position","Scale","Opacity","Rotation"],correct:2,explain:"Opacity — прозрачность (0–100%).",topic:"After Effects"},
  {q:"Что такое «Solid Drawing» в 12 принципах анимации?",options:["Твёрдые материалы в сцене","Передача объёма, веса и перспективы в рисунке","Жёсткая фиксация камеры","Чёрно-белый стиль"],correct:1,explain:"Solid Drawing — про объёмность и грамотную форму.",topic:"Анимация"},
  {q:"Что описывает принцип «Secondary Action»?",options:["Дублирование основного действия","Вспомогательное действие, обогащающее основное","Параллельный персонаж","Звуковой эффект"],correct:1,explain:"Secondary action подчёркивает главное действие, не отвлекая от него.",topic:"Анимация"},
  {q:"«Straight Ahead vs Pose to Pose» — это:",options:["Имена аниматоров","Два метода построения анимации: подряд кадр за кадром или через ключевые позы","Два формата файлов","Два типа экспозиции"],correct:1,explain:"Straight Ahead — последовательно; Pose to Pose — по ключевым позам.",topic:"Анимация"},
  {q:"Зачем нужен гибридный CPU+GPU рендер?",options:["Чтобы не использовать ГП","Чтобы задействовать оба ресурса для оптимума скорости и качества","Только для печати","Это маркетинговый термин"],correct:1,explain:"Гибрид использует сильные стороны и CPU, и GPU.",topic:"GPU-рендер"},
  {q:"Какая API часто применяется для GPU-вычислений на разных платформах?",options:["DirectInput","Vulkan","ASIO","XAudio"],correct:1,explain:"Vulkan — кроссплатформенный API для GPU (включая вычисления).",topic:"GPU-рендер"},
  {q:"Какая карта используется для имитации мелкого рельефа без увеличения геометрии?",options:["Color ID","Normal Map","Curvature","Position"],correct:1,explain:"Normal Map отклоняет нормали и имитирует рельеф.",topic:"Bake"},
  {q:"В каком инструменте чаще всего «запекают» финальные карты для текстурирования?",options:["Photoshop","Substance Painter","Premiere","Blender для видео"],correct:1,explain:"Substance Painter — стандарт текстурирования с возможностью bake.",topic:"Bake"},
  {q:"Что такое low-poly модель в пайплайне?",options:["Модель с миллионами полигонов","Облегчённая модель с минимумом полигонов, которая попадает в движок","Только UV-развёртка","Растровая текстура"],correct:1,explain:"Low-poly идёт в игровой движок и получает детали через карты.",topic:"Bake"},
  {q:"Что делает Hard Light по отношению к Overlay?",options:["Полностью совпадает","Это Overlay с инверсией ролей слоёв (более жёсткий контраст)","Делает чёрно-белым","Только осветляет"],correct:1,explain:"В Hard Light доминирует верхний слой, в Overlay — нижний.",topic:"Blending"},
  {q:"Linear Burn — это:",options:["a + b с клиппингом","a + b − 255 (более глубокие тени, чем Multiply)","Среднее каналов","Инверсия цветов"],correct:1,explain:"Linear Burn даёт более тёмный результат, чем Multiply.",topic:"Blending"},

];

const form = document.getElementById('quiz-form');
const progressText = document.getElementById('progress-text');
const progressFill = document.getElementById('progress-fill');
const progressPct = document.getElementById('progress-pct');
const submitBtn = document.getElementById('submit-btn');
const resetBtn = document.getElementById('reset-btn');
const resultsDiv = document.getElementById('results');
const letters = ['A','B','C','D'];
let submitted = false;

function renderQuiz() {
  form.innerHTML = '';
  questions.forEach((item, i) => {
    const qEl = document.createElement('div');
    qEl.className = 'question';
    qEl.id = 'q-' + i;
    qEl.innerHTML = `
      <div class="q-num">Вопрос ${i + 1} · ${item.topic}</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.options.map((opt, j) => `
          <label class="option" data-idx="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span class="option-letter">${letters[j]}.</span>
            <span class="option-text">${opt}</span>
          </label>
        `).join('')}
      </div>
    `;
    form.appendChild(qEl);
  });
  attachListeners();
  updateProgress();
}

function attachListeners() {
  form.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener('change', () => {
      if (submitted) return;
      const labels = input.closest('.options').querySelectorAll('.option');
      labels.forEach(l => l.classList.remove('selected'));
      input.closest('.option').classList.add('selected');
      updateProgress();
    });
  });
}

function updateProgress() {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  const pct = Math.round((answered / questions.length) * 100);
  progressText.textContent = `${answered} / ${questions.length}`;
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

function gradeForScore(score, total) {
  const pct = (score / total) * 100;
  if (pct >= 90) return { cls: 'excellent', text: 'Отлично — к тесту готов!' };
  if (pct >= 75) return { cls: 'good',      text: 'Хорошо. Повтори слабые темы.' };
  if (pct >= 60) return { cls: 'ok',        text: 'Удовлетворительно. Нужно повторение.' };
  return                 { cls: 'weak',      text: 'Слабо. Вернись к базе знаний.' };
}

function submitQuiz() {
  let score = 0;
  const topics = {};
  questions.forEach((item, i) => {
    if (!topics[item.topic]) topics[item.topic] = { correct: 0, total: 0 };
    topics[item.topic].total++;
    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    const userIdx = selected ? parseInt(selected.value, 10) : -1;
    const isCorrect = userIdx === item.correct;
    if (isCorrect) { score++; topics[item.topic].correct++; }
    const qEl = document.getElementById('q-' + i);
    qEl.classList.add('review-q');
    if (!isCorrect) qEl.classList.add(userIdx === -1 ? 'is-skipped' : 'is-wrong');
    const optionEls = qEl.querySelectorAll('.option');
    optionEls.forEach((el, j) => {
      const input = el.querySelector('input');
      input.disabled = true;
      el.classList.remove('selected');
      if (j === item.correct) el.classList.add('correct');
      if (j === userIdx && userIdx !== item.correct) el.classList.add('wrong');
    });
    const explainEl = document.createElement('div');
    explainEl.className = 'explain';
    const userLabel = userIdx === -1 ? '<em>не отвечен</em>' : letters[userIdx];
    explainEl.innerHTML = `<strong>Правильный ответ: ${letters[item.correct]}.</strong> Твой ответ: ${userLabel}.<br>${item.explain}`;
    qEl.appendChild(explainEl);
  });
  const grade = gradeForScore(score, questions.length);
  const topicHtml = Object.entries(topics).map(([name, t]) => {
    const pct = Math.round((t.correct / t.total) * 100);
    let cls = 'low';
    if (pct >= 75) cls = 'ok';
    else if (pct >= 50) cls = 'mid';
    return `<div class="topic-stat"><span>${name}</span><span class="pct ${cls}">${t.correct} / ${t.total} · ${pct}%</span></div>`;
  }).join('');
  resultsDiv.innerHTML = `
    <div class="score-label">Результат</div>
    <div class="score">${score} / ${questions.length}</div>
    <div class="grade ${grade.cls}">${grade.text}</div>
    <div class="topic-stats">${topicHtml}</div>
  `;
  resultsDiv.classList.remove('hidden');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  submitBtn.disabled = true;
  submitBtn.textContent = 'Тест завершён';
  submitted = true;
}

function resetQuiz() {
  if (submitted && !confirm('Сбросить результаты и начать заново?')) return;
  if (!submitted) {
    const answered = form.querySelectorAll('input[type="radio"]:checked').length;
    if (answered > 0 && !confirm('Стереть все ответы?')) return;
  }
  submitted = false;
  submitBtn.disabled = false;
  submitBtn.textContent = 'Проверить результат';
  resultsDiv.classList.add('hidden');
  resultsDiv.innerHTML = '';
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

submitBtn.addEventListener('click', () => {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  if (answered < questions.length) {
    if (!confirm(`Отвечено ${answered} из ${questions.length}. Завершить тест?`)) return;
  }
  submitQuiz();
});
resetBtn.addEventListener('click', resetQuiz);

renderQuiz();
</script>
