<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по моушн-дизайну · Вариант 3</title>
<style>
  :root {
    --bg: #0f1115; --surface: #1a1d24; --surface-2: #242830; --text: #e7e9ee;
    --muted: #9aa0ad; --accent: #4f8cff; --correct: #2ecc71; --wrong: #e74c3c;
    --warn: #f39c12; --border: #2c313b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
  .container { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; }
  .progress-bar { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 10; border-bottom: 1px solid var(--border); margin-bottom: 16px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .progress-track { flex: 1; height: 4px; background: var(--surface-2); border-radius: 2px; margin: 0 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
  .question { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .q-num { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
  .q-text { font-size: 16px; margin-bottom: 14px; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: background 0.12s, border-color 0.12s; font-size: 15px; }
  .option:hover { background: #2d323c; }
  .option input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
  .option.selected { border-color: var(--accent); background: #2a3344; }
  .option.correct { border-color: var(--correct); background: rgba(46, 204, 113, 0.12); }
  .option.wrong { border-color: var(--wrong); background: rgba(231, 76, 60, 0.12); }
  .option-letter { font-weight: 600; color: var(--muted); min-width: 18px; }
  .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  button { background: var(--accent); color: #fff; border: none; padding: 12px 22px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.12s, opacity 0.12s; font-family: inherit; }
  button:hover { background: #3d77e6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--surface-2); color: var(--text); }
  button.secondary:hover { background: #2d323c; }
  .results { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .score { font-size: 42px; font-weight: 700; margin: 6px 0; }
  .score-label { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: 0.6px; }
  .grade { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-weight: 500; display: inline-block; }
  .grade.excellent { background: rgba(46,204,113,0.15); color: var(--correct); }
  .grade.good { background: rgba(79,140,255,0.15); color: var(--accent); }
  .grade.ok { background: rgba(243,156,18,0.15); color: var(--warn); }
  .grade.weak { background: rgba(231,76,60,0.15); color: var(--wrong); }
  .topic-stats { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
  .topic-stat { background: var(--surface-2); padding: 8px 12px; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .topic-stat .pct { font-weight: 600; }
  .pct.ok { color: var(--correct); } .pct.mid { color: var(--warn); } .pct.low { color: var(--wrong); }
  .review-q { border-left: 4px solid var(--correct); }
  .review-q.is-wrong { border-left-color: var(--wrong); }
  .review-q.is-skipped { border-left-color: var(--warn); }
  .explain { margin-top: 12px; padding: 10px 14px; background: rgba(79,140,255,0.08); border-left: 3px solid var(--accent); border-radius: 4px; font-size: 14px; color: var(--muted); }
  .explain strong { color: var(--text); }
  .hidden { display: none; }
  @media (max-width: 600px) { h1 { font-size: 22px; } .container { padding: 16px 12px 60px; } .question { padding: 14px 14px; } .score { font-size: 34px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Тест по моушн-дизайну · Вариант 3</h1>
    <div class="subtitle">85 вопросов · один правильный ответ · 40 источников + реальные тесты по AE/C4D</div>
    <div class="subtitle"><a href="index.html" style="color:#4f8cff;">← к выбору варианта</a></div>
  </header>

  <div id="progress-bar" class="progress-bar">
    <span id="progress-text">0 / 50</span>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <span id="progress-pct">0%</span>
  </div>

  <form id="quiz-form"></form>

  <div class="actions" id="action-area">
    <button type="button" id="submit-btn">Проверить результат</button>
    <button type="button" class="secondary" id="reset-btn">Сбросить</button>
  </div>

  <div id="results" class="results hidden"></div>
</div>

<script>
const questions = [
  {q:"Что такое «ритм» в композиции?",options:["Скорость движения объектов","Повторение однотипных элементов с регулярным интервалом","Контраст светлого и тёмного","Соотношение сторон"],correct:1,explain:"Ритм — повторение элементов через закономерные интервалы.",topic:"Композиция"},
  {q:"На сколько ячеек делит холст правило третей?",options:["4","6","9","16"],correct:2,explain:"Сетка 3×3 = 9 ячеек.",topic:"Композиция"},
  {q:"Что такое баланс в композиции?",options:["Симметрия по обеим осям","Равновесие визуальных весов элементов","Одинаковый размер всех объектов","Тёмный угол справа"],correct:1,explain:"Баланс — равновесие визуальной массы.",topic:"Композиция"},
  {q:"Чем характеризуется асимметричная композиция?",options:["Зеркальная симметрия","Явные различия между частями относительно центральной оси","Полное отсутствие фокуса","Только одной точкой"],correct:1,explain:"Стороны различны, но композиция остаётся уравновешенной за счёт визуальных весов.",topic:"Композиция"},
  {q:"Какая графическая форма часто визуализирует золотое сечение?",options:["Окружность","Спираль (Фибоначчи)","Квадрат","Звезда"],correct:1,explain:"Золотая спираль строится по сетке Фибоначчи.",topic:"Композиция"},
  {q:"Что характерно для структуры с множественными точками фокуса?",options:["Один центральный объект","Несколько зон интереса с чёткой иерархией","Полное отсутствие иерархии","Только симметрия"],correct:1,explain:"Несколько фокусов с расставленными приоритетами.",topic:"Композиция"},
  {q:"Если персонаж в кадре виден «от талии и выше» — это какой план?",options:["Дальний","Поясной (первый средний)","Крупный","Макро"],correct:1,explain:"Первый средний (поясной) — выше талии.",topic:"Планы"},
  {q:"Какой план максимально удалён от объекта?",options:["Общий","Дальний","Второй средний","Поясной"],correct:1,explain:"Дальний — самый широкий охват сцены.",topic:"Планы"},
  {q:"Сколько основных типов планов чаще всего выделяется?",options:["3","6","9","12"],correct:1,explain:"Дальний, общий, второй средний, поясной, крупный, макро — 6.",topic:"Планы"},
  {q:"На каком плане акцент делается на атмосфере и окружении?",options:["Крупном","Поясном","Дальнем","Макро"],correct:2,explain:"Дальний план — атмосфера и окружение.",topic:"Планы"},
  {q:"Что должно сохраняться согласно «монтаж по цвету»?",options:["Резкие цветовые переходы","Отсутствие резких цветовых перепадов между склейками","Чёрно-белая палитра","Холодные тона"],correct:1,explain:"Цветовая согласованность между склеиваемыми кадрами.",topic:"Монтаж"},
  {q:"Зачем нужен принцип «монтаж по крупности»?",options:["Чтобы упростить съёмку","Чтобы избежать рывков восприятия и прыжков масштаба","Чтобы увеличить хронометраж","Чтобы заполнить тишину"],correct:1,explain:"Промежуточные планы делают переходы плавными.",topic:"Монтаж"},
  {q:"Если персонаж движется слева направо в первом кадре, в какую сторону он должен двигаться в следующем (по принципу направления)?",options:["Справа налево","Слева направо","В любую","Стоять на месте"],correct:1,explain:"Направление движения должно сохраняться.",topic:"Монтаж"},
  {q:"Что подразумевает «монтаж по фазе движения»?",options:["Склейка строго посередине движения","Склейка на начале или конце фазы движения","Игнорирование движения","Только медленные движения"],correct:1,explain:"Естественные точки склейки — старт и финиш фазы.",topic:"Монтаж"},
  {q:"Что такое «ось» в монтаже сцены диалога двух персонажей?",options:["Линия движения камеры","Воображаемая линия взаимодействия между персонажами","Диагональ кадра","Линия горизонта"],correct:1,explain:"Камеры размещаются с одной стороны этой линии.",topic:"Монтаж"},
  {q:"В 16-битной модели RGB на канал — сколько уровней яркости?",options:["256","65 536","1024","4096"],correct:1,explain:"2¹⁶ = 65 536.",topic:"Цвет"},
  {q:"Какая цветовая модель используется в типографских красках?",options:["RGB","HSB","CMYK","Lab"],correct:2,explain:"Печать — CMYK (C, M, Y, K=Black).",topic:"Цвет"},
  {q:"Что такое «primary colors» в субтрактивной модели?",options:["Red, Green, Blue","Cyan, Magenta, Yellow","Hue, Saturation, Value","White, Black, Gray"],correct:1,explain:"Cyan, Magenta, Yellow — основа CMY(K).",topic:"Цвет"},
  {q:"Какой компонент модели HSB регулирует «светлоту» цвета?",options:["Hue","Saturation","Brightness","Alpha"],correct:2,explain:"Brightness/Value — светлота.",topic:"Цвет"},
  {q:"RGB(0,0,0) соответствует:",options:["Белому","Чёрному","Серому","Красному"],correct:1,explain:"Все каналы на нуле = чёрный.",topic:"Цвет"},
  {q:"Какая модель ближе всего к восприятию цвета человеком?",options:["RGB","CMYK","Lab","HEX"],correct:2,explain:"Lab — perceptually uniform.",topic:"Цвет"},
  {q:"Что отображает цветовой круг?",options:["Размер пикселей","Расположение оттенков по спектру","Гамму","Глубину цвета"],correct:1,explain:"Hue распределён по окружности 0–360°.",topic:"Цвет"},
  {q:"Какие цвета называются «дополнительными»?",options:["Соседние на круге","Пары противоположных на цветовом круге","Только тёплые","Только холодные"],correct:1,explain:"Например: красный↔зелёный, синий↔жёлтый.",topic:"Цвет"},
  {q:"Сколько каналов у RGBA-изображения?",options:["2","3","4","5"],correct:2,explain:"RGB + Alpha = 4 канала.",topic:"Цвет"},
  {q:"Что описывает sRGB?",options:["Стандартное цветовое пространство веба и большинства мониторов","Профессиональное полиграфическое пространство","Печатную модель","Видеокодек"],correct:0,explain:"sRGB — де-факто стандарт веба.",topic:"Гамма/контраст"},
  {q:"Что такое эквализация гистограммы?",options:["Усиление шума","Выравнивание распределения яркостей по диапазону","Удаление цвета","Сжатие изображения"],correct:1,explain:"Эквализация делает гистограмму равномерной.",topic:"Гамма/контраст"},
  {q:"Какое значение n в гамма-преобразовании повышает контраст в тенях (низких яркостях)?",options:["n = 0,1…0,5","n = 1","n = 2…10","n < 0"],correct:0,explain:"Низкое n даёт акцент на тёмные тона.",topic:"Гамма/контраст"},
  {q:"Зачем переводят изображение в линейное пространство при 3D-рендере?",options:["Для уменьшения файла","Чтобы свет складывался физически корректно","Для печати","Чтобы ускорить рендер"],correct:1,explain:"В Linear γ=1 — корректное смешение света.",topic:"Гамма/контраст"},
  {q:"Какой метод повышения контраста наиболее простой и быстрый?",options:["Адаптивный","Линейное растяжение","Машинное обучение","Соляризация"],correct:1,explain:"Линейное растяжение — самый базовый и быстрый.",topic:"Гамма/контраст"},
  {q:"Какая часть трёхточечной схемы освещения создаёт основные тени?",options:["Fill","Back","Key","Ambient"],correct:2,explain:"Key (рисующий) формирует основной светотеневой рисунок.",topic:"Освещение"},
  {q:"Где располагается контровой свет относительно объекта?",options:["Спереди-сверху","Сзади-сверху","Сбоку","Снизу"],correct:1,explain:"Контровой бьёт сзади, создавая обводку силуэта.",topic:"Освещение"},
  {q:"Что такое pinspot?",options:["Софтбокс","Прибор узконаправленного света для точечного акцента","Заливающий прожектор","Светофильтр"],correct:1,explain:"Pinspot — узкий луч для маленьких акцентов.",topic:"Освещение"},
  {q:"Какой свет используют как эффектный приём из-под рампы (снизу)?",options:["Front","Back","Top","Нижний"],correct:3,explain:"Нижний свет применяется редко — как драматический эффект.",topic:"Освещение"},
  {q:"Зачем нужен «свет на задник»?",options:["Чтобы осветить пол","Чтобы отделить фон от переднего плана","Чтобы убрать тени актёра","Чтобы увеличить ИК-излучение"],correct:1,explain:"Подсветка задника даёт глубину и сепарацию планов.",topic:"Освещение"},
  {q:"В чём ключевая разница между tracking и rotoscoping?",options:["Это синонимы","Tracking — отслеживание движения; rotoscoping — ручная отрисовка маски по кадрам","Tracking работает только в 3D","Rotoscoping применяется к звуку"],correct:1,explain:"Разные задачи: трекинг привязывает данные движения; ротоскоп — выделяет объект.",topic:"VFX"},
  {q:"Что хранится в alpha-канале?",options:["Цвет","Прозрачность пикселя","Глубина","Скорость"],correct:1,explain:"Alpha кодирует прозрачность.",topic:"VFX"},
  {q:"Что такое chroma key?",options:["Аппаратный ключ","Удаление цвета фона (зелёного/синего) для прозрачности","Кодек","Инструмент рисования"],correct:1,explain:"Chroma key — keying по цвету, классическая «зелёнка».",topic:"VFX"},
  {q:"Какой эффект создаёт ощущение скорости движущегося объекта?",options:["Lens flare","Motion Blur","Depth of Field","Vignette"],correct:1,explain:"Размытие движения — главный приём передачи скорости.",topic:"VFX"},
  {q:"Что такое rendering в общем смысле?",options:["Звукозапись","Просчёт итогового изображения по сцене или композиции","Кадрирование","Цветокоррекция"],correct:1,explain:"Рендеринг — формирование итогового пикселя.",topic:"VFX"},
  {q:"Параметр Position в After Effects управляет:",options:["Прозрачностью","Положением слоя в пространстве кадра","Цветом","Кодеком"],correct:1,explain:"Position — координаты слоя.",topic:"After Effects"},
  {q:"Что такое Composition в After Effects?",options:["Тип кодека","Сцена с настройками разрешения, fps и длительности","Папка проекта","Название эффекта"],correct:1,explain:"Composition = таймлайн + параметры сцены.",topic:"After Effects"},
  {q:"Какой формат обычно выбирают для веб-публикации видео?",options:["DPX","H.264","TIFF","WAV"],correct:1,explain:"H.264 — оптимум по качеству/размеру для веба.",topic:"After Effects"},
  {q:"Принцип «Timing» в анимации определяет:",options:["Только продолжительность сцены","Скорость и количество кадров, формирующие характер движения","Цвет персонажа","Позу для рендера"],correct:1,explain:"Тайминг = ритм и характер движения.",topic:"Анимация"},
  {q:"Какой принцип отвечает за притягательность персонажа?",options:["Squash & Stretch","Appeal","Anticipation","Solid Drawing"],correct:1,explain:"Appeal — привлекательность, харизма героя.",topic:"Анимация"},
  {q:"Что такое «Exaggeration»?",options:["Уменьшение действия","Преувеличение для большей выразительности","Подавление эмоций","Замедление сцены"],correct:1,explain:"Преувеличение делает движение читабельным и живым.",topic:"Анимация"},
  {q:"Какая память используется GPU при рендере?",options:["RAM","VRAM","SSD","HDD"],correct:1,explain:"GPU работает с VRAM, объём которой обычно меньше системной RAM.",topic:"GPU-рендер"},
  {q:"Какой движок принадлежит компании Otoy и работает преимущественно на GPU?",options:["Cycles","Octane","V-Ray CPU","Mental Ray"],correct:1,explain:"Octane Render — GPU-рендер от Otoy.",topic:"GPU-рендер"},
  {q:"Какая карта при запечке показывает выпуклости и вогнутости поверхности?",options:["Color ID","Curvature","Position","Thickness"],correct:1,explain:"Curvature кодирует кривизну поверхности.",topic:"Bake"},
  {q:"Зачем нужна карта Thickness?",options:["Для определения цвета","Для имитации толщины объекта (например, для SSS)","Для UV-развёртки","Для AO"],correct:1,explain:"Thickness используется в шейдерах подповерхностного рассеивания.",topic:"Bake"},
  {q:"Что такое high-poly модель в контексте запечки?",options:["Облегчённая модель для движка","Высокодетализированная модель — источник деталей для запечки на low-poly","Запечённая текстура","Скриншот меша"],correct:1,explain:"High-poly содержит всю детализацию, переносимую в карты на low-poly.",topic:"Bake"},
  {q:"Какой режим наложения подходит для проверки идентичности двух изображений?",options:["Multiply","Difference (одинаковые пиксели → чёрный)","Screen","Overlay"],correct:1,explain:"Difference показывает чёрный там, где пиксели совпадают.",topic:"Blending"},
  {q:"Color Dodge делает изображение:",options:["Темнее","Светлее с усилением контраста","Чёрно-белым","Перевёрнутым по цвету"],correct:1,explain:"Color Dodge сильно поднимает света; чёрный нейтрален.",topic:"Blending"},
  {q:"Какой режим вычисляет min(a, b) поканально?",options:["Lighten","Darken","Screen","Add"],correct:1,explain:"Darken берёт минимум; Lighten — максимум.",topic:"Blending"},
  {q:"Чем отличается шрифт от гарнитуры?",options:["Это синонимы","Гарнитура — семейство, шрифт — конкретное начертание","Шрифт — только курсив","Гарнитура — только в Word"],correct:1,explain:"Helvetica — гарнитура; Helvetica Bold 12 pt — шрифт.",topic:"Типографика"},

const form = document.getElementById('quiz-form');
const progressText = document.getElementById('progress-text');
const progressFill = document.getElementById('progress-fill');
const progressPct = document.getElementById('progress-pct');
const submitBtn = document.getElementById('submit-btn');
const resetBtn = document.getElementById('reset-btn');
const resultsDiv = document.getElementById('results');
const letters = ['A','B','C','D'];
let submitted = false;

function renderQuiz() {
  form.innerHTML = '';
  questions.forEach((item, i) => {
    const qEl = document.createElement('div');
    qEl.className = 'question';
    qEl.id = 'q-' + i;
    qEl.innerHTML = `
      <div class="q-num">Вопрос ${i + 1} · ${item.topic}</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.options.map((opt, j) => `
          <label class="option" data-idx="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span class="option-letter">${letters[j]}.</span>
            <span class="option-text">${opt}</span>
          </label>
        `).join('')}
      </div>
    `;
    form.appendChild(qEl);
  });
  attachListeners();
  updateProgress();
}

function attachListeners() {
  form.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener('change', () => {
      if (submitted) return;
      const labels = input.closest('.options').querySelectorAll('.option');
      labels.forEach(l => l.classList.remove('selected'));
      input.closest('.option').classList.add('selected');
      updateProgress();
    });
  });
}

function updateProgress() {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  const pct = Math.round((answered / questions.length) * 100);
  progressText.textContent = `${answered} / ${questions.length}`;
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

function gradeForScore(score, total) {
  const pct = (score / total) * 100;
  if (pct >= 90) return { cls: 'excellent', text: 'Отлично — к тесту готов!' };
  if (pct >= 75) return { cls: 'good',      text: 'Хорошо. Повтори слабые темы.' };
  if (pct >= 60) return { cls: 'ok',        text: 'Удовлетворительно. Нужно повторение.' };
  return                 { cls: 'weak',      text: 'Слабо. Вернись к базе знаний.' };
}

function submitQuiz() {
  let score = 0;
  const topics = {};
  questions.forEach((item, i) => {
    if (!topics[item.topic]) topics[item.topic] = { correct: 0, total: 0 };
    topics[item.topic].total++;
    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    const userIdx = selected ? parseInt(selected.value, 10) : -1;
    const isCorrect = userIdx === item.correct;
    if (isCorrect) { score++; topics[item.topic].correct++; }
    const qEl = document.getElementById('q-' + i);
    qEl.classList.add('review-q');
    if (!isCorrect) qEl.classList.add(userIdx === -1 ? 'is-skipped' : 'is-wrong');
    const optionEls = qEl.querySelectorAll('.option');
    optionEls.forEach((el, j) => {
      const input = el.querySelector('input');
      input.disabled = true;
      el.classList.remove('selected');
      if (j === item.correct) el.classList.add('correct');
      if (j === userIdx && userIdx !== item.correct) el.classList.add('wrong');
    });
    const explainEl = document.createElement('div');
    explainEl.className = 'explain';
    const userLabel = userIdx === -1 ? '<em>не отвечен</em>' : letters[userIdx];
    explainEl.innerHTML = `<strong>Правильный ответ: ${letters[item.correct]}.</strong> Твой ответ: ${userLabel}.<br>${item.explain}`;
    qEl.appendChild(explainEl);
  });
  const grade = gradeForScore(score, questions.length);
  const topicHtml = Object.entries(topics).map(([name, t]) => {
    const pct = Math.round((t.correct / t.total) * 100);
    let cls = 'low';
    if (pct >= 75) cls = 'ok';
    else if (pct >= 50) cls = 'mid';
    return `<div class="topic-stat"><span>${name}</span><span class="pct ${cls}">${t.correct} / ${t.total} · ${pct}%</span></div>`;
  }).join('');
  resultsDiv.innerHTML = `
    <div class="score-label">Результат</div>
    <div class="score">${score} / ${questions.length}</div>
    <div class="grade ${grade.cls}">${grade.text}</div>
    <div class="topic-stats">${topicHtml}</div>
  `;
  resultsDiv.classList.remove('hidden');
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  submitBtn.disabled = true;
  submitBtn.textContent = 'Тест завершён';
  submitted = true;
}

function resetQuiz() {
  if (submitted && !confirm('Сбросить результаты и начать заново?')) return;
  if (!submitted) {
    const answered = form.querySelectorAll('input[type="radio"]:checked').length;
    if (answered > 0 && !confirm('Стереть все ответы?')) return;
  }
  submitted = false;
  submitBtn.disabled = false;
  submitBtn.textContent = 'Проверить результат';
  resultsDiv.classList.add('hidden');
  resultsDiv.innerHTML = '';
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

submitBtn.addEventListener('click', () => {
  const answered = form.querySelectorAll('input[type="radio"]:checked').length;
  if (answered < questions.length) {
    if (!confirm(`Отвечено ${answered} из ${questions.length}. Завершить тест?`)) return;
  }
  submitQuiz();
});
resetBtn.addEventListener('click', resetQuiz);

renderQuiz();
</script>
